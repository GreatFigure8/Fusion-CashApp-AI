[project]
name = "cashapp"
version = "0.1.0"
description = "Fusion CashApp AI: automated cash application for Oracle Fusion Receivables"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "oracledb>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sse-starlette>=2.1",
    "aiokafka>=0.11",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
    "httpx>=0.27",
    "anthropic>=0.40",
    "oci>=2.130",
    "defusedxml>=0.7",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "python-json-logger>=2.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pypdf>=4.2",
    "pillow>=10.3",
    "python-docx>=1.1",
    "extract-msg>=0.50",
    "beautifulsoup4>=4.12",
    "aioimaplib>=1.1",
    "typer>=0.12",
    "mcp>=2.3,<3",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "time-machine>=2.14",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashapp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S", "PT", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/versions/*" = ["E501"]

[tool.pyright]
include = ["src", "tests", "alembic"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "atp: needs the DEV ATP schema (opt in with -m atp)",
    "live: calls a live external system (opt in with -m live)",
]
addopts = ["--strict-markers", "-m", "not atp and not live"]

[tool.coverage.run]
source = ["cashapp"]
branch = true
